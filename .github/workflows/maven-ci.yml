name: Maven CI
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "25"
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw clean verify